name: Build Typst
on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: infra
            output: Luca_Parolini_Infra.pdf
          - variant: cybersec
            output: Luca_Parolini_Cybersec.pdf

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - run: typst compile --input variant=${{ matrix.variant }} main.typ ${{ matrix.output }}

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          path: pdfs
          merge-multiple: true

      - name: Bump version and push tag
        id: tagger
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename PDFs with version
        run: |
          for f in pdfs/*.pdf; do
            mv "$f" "${f%.pdf}_${{ steps.tagger.outputs.new_tag }}.pdf"
          done

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.new_tag }}
          files: pdfs/*.pdf
          make_latest: true
